<!-- Supabase → Authentication → Emails → Templates → Reset password.
     Subject: Your Prompt Heart password code: {{ .Token }} -->
<div style="margin:0;padding:0;background-color:#f7f3ea;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f3ea;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <img src="https://inigo-code.github.io/prompt-heart-site/email-logo.png" width="56" height="56" alt="Prompt Heart" style="display:block;border:0;outline:none;text-decoration:none;width:56px;height:56px;">
              <div style="margin-top:10px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.3px;color:#1c1a17;">Prompt <span style="color:#d99a1e;">Heart</span></div>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;border:1px solid #e6dfd1;border-radius:18px;padding:28px 28px 24px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1a17;">
              <h1 style="margin:0 0 8px;font-size:20px;font-weight:800;line-height:1.3;">Reset your password</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#4a453f;">Enter this code in the app, then choose a new password:</p>
              <div style="background-color:#f7e7c4;border-radius:14px;padding:16px;text-align:center;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#1c1a17;">{{ .Token }}</div>
              <p style="margin:20px 0 0;font-size:13px;line-height:1.5;color:#76706a;">The code expires in 1 hour. If you didn't ask to reset your password, you can ignore this email; your password stays the same.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:18px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#76706a;">
              Prompt Heart · Your AI prompts, one tap away<br>
              <a href="https://inigo-code.github.io/prompt-heart-site/privacy.html" style="color:#76706a;">Privacy policy</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
