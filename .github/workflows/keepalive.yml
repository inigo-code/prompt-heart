# Keeps the free Supabase project from pausing (it pauses after a week with no activity).
# Makes one tiny read each day. The URL and publishable key are public (they ship inside the app);
# Row Level Security means this request returns no data, but it counts as activity.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch: {}

env:
  SUPABASE_URL: https://qhwavloktmgbywcjcxpr.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_MeaibTADsGPbC7dvO2ugjA_Hjf_EhCa

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/prompts?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
